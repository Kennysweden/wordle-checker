const lookup=new Map(WORDS.map(w=>[w.toLowerCase(),w]));
const results=document.getElementById('results'),summary=document.getElementById('summary');
const fields=[],statuses=[],usedStatuses=[];
let selectedIndex=0;
// Phones always use the built-in on-screen keyboard, without a toggle.
// Computers default to their physical keyboard, with an optional on-screen choice.
const keyboardModeButton=document.getElementById('keyboard-mode');
const phoneDevice=/iPhone|iPod|Android.*Mobile|Windows Phone|Mobile/i.test(navigator.userAgent) ||
  (window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width,screen.height)<=600);
let keyboardMode='screen';
if(!phoneDevice){
 try {
  const savedMode=localStorage.getItem('schubert-keyboard-mode');
  keyboardMode=(savedMode==='screen'||savedMode==='physical')?savedMode:'physical';
 } catch {keyboardMode='physical';}
}
keyboardModeButton.hidden=phoneDevice;
function setKeyboardMode(mode,remember=true){
 keyboardMode=phoneDevice?'screen':mode;
 const physical=keyboardMode==='physical';
 document.body.classList.toggle('physical-keyboard',physical);
 keyboardModeButton.textContent=physical?'On-screen keyboard':'Physical keyboard';
 keyboardModeButton.setAttribute('aria-pressed',String(physical));
 fields.forEach(field=>field.readOnly=!physical);
 if(remember&&!phoneDevice){try{localStorage.setItem('schubert-keyboard-mode',keyboardMode)}catch{}}
 fitVisibleScreen();
}
keyboardModeButton.addEventListener('click',()=>{
 if(phoneDevice)return;
 setKeyboardMode(keyboardMode==='physical'?'screen':'physical');
 if(fields[selectedIndex])fields[selectedIndex].focus({preventScroll:true});
});
function selectRow(i){
 selectedIndex=Math.max(0,Math.min(fields.length-1,i));
 fields.forEach((f,j)=>f.classList.toggle('selected',j===selectedIndex));
 keepVisible(fields[selectedIndex]);
}


 let visibleRows=1;
const storageKey='wordle-checker-entries';
let savedEntries=[];
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(stored))savedEntries=stored}catch{}
function saveEntries(){try{localStorage.setItem(storageKey,JSON.stringify(fields.map(f=>f.value)))}catch{}}
function check(){
 let entered=0,found=0;
 fields.forEach((field,i)=>{
  const raw=field.value,match=lookup.get(raw.toLowerCase()),status=statuses[i],usedStatus=usedStatuses[i];
  status.className='status';status.textContent='';usedStatus.className='used-status';usedStatus.textContent='';
  if(!raw)return;
  entered++;
  if(raw.length===5){const wasUsed=USED_SOLUTIONS.has(raw.toUpperCase());usedStatus.textContent=wasUsed?'YES':'No';usedStatus.classList.add(wasUsed?'used-yes':'used-no')}
  if(raw.length!==5){status.textContent='5 letters needed';status.classList.add('extra')}
  else if(match){found++;status.textContent=match===match.toLowerCase()?'Yes – Wordle Only':'Yes';status.classList.add('yes')}
  else{status.textContent='Not on list';status.classList.add('no')}
 });
 saveEntries();
 summary.textContent=entered?`${found} of ${entered} on the list.`:'Ready for as many words as you like.';
}
function revealThrough(index){
  if(index>=visibleRows){
   while(fields.length<=index)addRow();
   visibleRows=index+1;
   fields.forEach((f,j)=>{f.closest('tr').hidden=j>=visibleRows});
  }
 }
 function moveNext(i){
  revealThrough(i+1);selectRow(i+1);fields[i+1].focus({preventScroll:true});keepVisible(fields[i+1])
 }
function addRow(){
 const i=fields.length;
 const row=document.createElement('tr'),number=document.createElement('td'),cell=document.createElement('td'),status=document.createElement('td'),usedStatus=document.createElement('td'),field=document.createElement('input');
 number.textContent=String(i+1);field.type='text';field.className='word';field.readOnly=keyboardMode!=='physical';field.maxLength=5;field.autocomplete='off';field.autocapitalize='characters';field.spellcheck=false;field.setAttribute('aria-label',`Word ${i+1}`);field.setAttribute('enterkeyhint','next');
 status.className='status';status.id=`result-${i+1}`;field.setAttribute('aria-describedby',status.id);
 let editing=false,previous='';
 field.addEventListener('focus',()=>{selectRow(i);editing=field.value.length>0;previous=field.value});
 field.addEventListener('input',event=>{
  field.value=field.value.replace(/[^a-z]/gi,'').slice(0,5).toUpperCase();check();
  const complete=!editing&&previous.length<5&&field.value.length===5&&!event.isComposing;
  previous=field.value;
  if(complete)moveNext(i);
 });
 field.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();moveNext(i)}});
 field.addEventListener('paste',event=>{
  const text=event.clipboardData.getData('text'),tokens=text.trim().split(/[\s,;]+/).filter(Boolean);
  if(tokens.length<2)return;
  event.preventDefault();let j=i;
  for(const token of tokens){while(fields.length<=j)addRow();fields[j++].value=token.replace(/[^a-z]/gi,'').slice(0,5).toUpperCase()}
  check();revealThrough(j);fields[j].focus({preventScroll:true});keepVisible(fields[j]);
 });
 field.value=typeof savedEntries[i]==='string'?savedEntries[i].replace(/[^a-z]/gi,'').slice(0,5).toUpperCase():'';
 const deleteCell=document.createElement('td'),deleteButton=document.createElement('button');
 deleteButton.type='button';deleteButton.className='delete';deleteButton.textContent='×';deleteButton.setAttribute('aria-label',`Delete word ${i+1}`);
 deleteButton.addEventListener('click',()=>{field.value='';check();selectRow(i);field.focus({preventScroll:true});keepVisible(field)});
 deleteCell.append(deleteButton);
 fields.push(field);statuses.push(status);usedStatuses.push(usedStatus);cell.append(field);row.append(number,cell,status,usedStatus,deleteCell);results.append(row);
 row.hidden=i>=visibleRows;
}
for(let i=0;i<Math.max(1,savedEntries.length+1);i++)addRow();
document.getElementById('clear').addEventListener('click',()=>{fields.forEach(f=>f.value='');visibleRows=1;fields.forEach((f,i)=>f.closest('tr').hidden=i>=visibleRows);check();selectRow(0);fields[0].focus({preventScroll:true});keepVisible(fields[0])});

function updateApp(){
 if(location.protocol!=='https:' && location.protocol!=='http:'){
  summary.textContent='Upload this file to your website first to use Update app.';
  return;
 }
 if(navigator.onLine===false){
  summary.textContent='Connect to the internet, then tap Update app again.';
  return;
 }
 const fresh=new URL(location.href);
 fresh.searchParams.set('v',String(Date.now()));
 location.replace(fresh.href);
}

function keepVisible(field){
 const list=document.getElementById('list-scroll');
 const area=list.getBoundingClientRect(),row=field.getBoundingClientRect();
 if(row.top<area.top+6)list.scrollTop-=area.top+6-row.top;
 else if(row.bottom>area.bottom-6)list.scrollTop+=row.bottom-area.bottom+6;
}
function fitVisibleScreen(){
 const viewport=window.visualViewport;
 document.documentElement.style.setProperty('--app-top',`${viewport?viewport.offsetTop:0}px`);
 document.documentElement.style.setProperty('--app-height',`${viewport?viewport.height:window.innerHeight}px`);
 const active=document.activeElement;
 if(active&&active.classList&&active.classList.contains('word'))keepVisible(active);
}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitVisibleScreen);window.visualViewport.addEventListener('scroll',fitVisibleScreen)}
window.addEventListener('resize',fitVisibleScreen);
fitVisibleScreen();

const viewButton=document.getElementById('view');
function setCompact(compact){
 document.body.classList.toggle('compact',compact);
 viewButton.textContent=compact?'Roomy view':'Compact view';
 viewButton.setAttribute('aria-pressed',String(compact));
 try{localStorage.setItem('wordle-checker-compact',String(compact))}catch{}
}
let compact=false;try{compact=localStorage.getItem('wordle-checker-compact')==='true'}catch{}
setCompact(compact);
viewButton.addEventListener('click',()=>setCompact(!document.body.classList.contains('compact')));
document.getElementById('done').addEventListener('click',()=>{if(document.activeElement&&typeof document.activeElement.blur==='function')document.activeElement.blur();saveEntries()});
document.getElementById('update').addEventListener('click',updateApp);window.addEventListener('pagehide',saveEntries);

// Custom keyboard works without the iPhone's native keyboard.
function keyPress(key){
 const field=fields[selectedIndex];
 if(!field)return;
 if(key==='NEXT'){moveNext(selectedIndex);return}
 if(key==='BACK')field.value=field.value.slice(0,-1);
 else if(/^[A-Z]$/.test(key)&&field.value.length<5)field.value+=key;
 check();
 if(field.value.length===5&&key!=='BACK')moveNext(selectedIndex);
 else{selectRow(selectedIndex);field.focus({preventScroll:true})}
}
for(const [id,keys] of [['keys-1','QWERTYUIOP'],['keys-2','ASDFGHJKL'],['keys-3','ZXCVBNM']]){
 const row=document.getElementById(id);
 const items=id==='keys-3'?['BACK',...keys,'NEXT']:[...keys];
 for(const key of items){
  const button=document.createElement('button');
  button.type='button';button.className='key'+(key.length>1?' special':'');
  button.textContent=key==='BACK'?'⌫':key==='NEXT'?'Next':key;
  button.setAttribute('aria-label',key==='BACK'?'Backspace':key==='NEXT'?'Next word':key);
  button.addEventListener('pointerdown',e=>e.preventDefault());
  button.addEventListener('click',()=>keyPress(key));
  row.append(button);
 }
}

 setKeyboardMode(keyboardMode,false);
 const lastFilled=fields.reduce((last,f,i)=>f.value?i:last,-1);
 revealThrough(Math.max(0,lastFilled+1));
 fields.forEach((f,i)=>f.closest('tr').hidden=i>=visibleRows);
 check();
 function resumeAtNext(){
  // Never take focus away from someone already editing a word.
  if(document.activeElement&&document.activeElement.classList?.contains('word')){selectRow(fields.indexOf(document.activeElement));return;}
  let next=fields.findIndex(f=>!f.value);
  if(next<0)next=fields.length;
  revealThrough(next);
  selectRow(next);fields[next].focus({preventScroll:true});
  requestAnimationFrame(()=>keepVisible(fields[next]));
 }
 window.addEventListener('pageshow',()=>setTimeout(resumeAtNext,180));
 if(document.readyState==='complete')setTimeout(resumeAtNext,180);
 else window.addEventListener('load',()=>setTimeout(resumeAtNext,180),{once:true});
</script></body></html>
